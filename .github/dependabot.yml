version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age before proposing it (pnpm-workspace.yaml's
    # minimumReleaseAge guards installs the same way).
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/desktop/docker/host-image
    schedule:
      interval: weekly
