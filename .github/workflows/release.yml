# Manor Release Workflow
#
# Builds, signs, notarizes, and publishes Manor to GitHub Releases.
# Triggered by pushing a version tag (e.g., git tag v0.2.0 && git push --tags).
#
# Required repository secrets:
#
#   CSC_LINK
#     Base64-encoded .p12 certificate for macOS code signing.
#     Export from Keychain Access: Developer ID Application certificate -> Export as .p12
#     Then: base64 -i certificate.p12 | pbcopy
#
#   CSC_KEY_PASSWORD
#     Password used when exporting the .p12 certificate.
#
#   APPLE_ID
#     Apple ID email address for notarization (must be enrolled in Apple Developer Program).
#
#   APPLE_APP_SPECIFIC_PASSWORD
#     App-specific password for notarization.
#     Generate at: https://appleid.apple.com -> Sign-In and Security -> App-Specific Passwords
#
#   APPLE_TEAM_ID
#     Your Apple Developer Team ID.
#     Find at: https://developer.apple.com/account -> Membership Details

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm pkg set version="$VERSION"

      - name: Install dependencies
        run: pnpm install

      # electron-builder (<=26.16) passes the .p12 export password to
      # `security set-key-partition-list -k`, which expects the *keychain*
      # password. macOS 26.6 started enforcing that unlock, so its built-in
      # keychain setup fails. We build the keychain ourselves and hand
      # electron-builder CSC_KEYCHAIN, which bypasses that code path.
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/manor-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/certificate.p12"

          echo "$CSC_LINK" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build and publish
        run: pnpm run build && pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Publish release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/{/^## \[$VERSION\]/p; /^## \[/!p}" CHANGELOG.md 2>/dev/null || echo "")
          if [ -n "$NOTES" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --notes "$NOTES"
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
