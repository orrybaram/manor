# Manor Release Workflow
#
# Builds, signs, notarizes, and publishes Manor to GitHub Releases.
# Triggered by pushing a version tag (e.g., git tag v0.2.0 && git push --tags).
#
# Required repository secrets:
#
#   CSC_LINK
#     Base64-encoded .p12 certificate for macOS code signing.
#     Export from Keychain Access: Developer ID Application certificate -> Export as .p12
#     Then: base64 -i certificate.p12 | pbcopy
#
#   CSC_KEY_PASSWORD
#     Password used when exporting the .p12 certificate.
#
#   APPLE_ID
#     Apple ID email address for notarization (must be enrolled in Apple Developer Program).
#
#   APPLE_APP_SPECIFIC_PASSWORD
#     App-specific password for notarization.
#     Generate at: https://appleid.apple.com -> Sign-In and Security -> App-Specific Passwords
#
#   APPLE_TEAM_ID
#     Your Apple Developer Team ID.
#     Find at: https://developer.apple.com/account -> Membership Details
#
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (optional)
#     Publish the per-version web build to the relay's R2 bucket and deploy the
#     relay Worker. Skipped with a warning when absent, so forks
#     still release. The token needs Workers Scripts:Edit and Workers R2
#     Storage:Edit.
#
# Host image: the host-image job pushes the multi-arch
# ghcr.io/orrybaram/manor-host:<version> and :latest using GITHUB_TOKEN (no
# extra secret). GHCR packages start private, so after the FIRST push set the
# package public once by hand: GitHub -> Packages -> manor-host -> Package
# settings -> Change visibility -> Public. Until then pulls need a login.
#
# The image bakes in the version's host package: the job builds
# the app's bundles and the host tarball, and the image build npm-installs it
# into /opt/manor/host-<version>/ for each arch (node-pty compiles there,
# under QEMU for arm64, hence the longer timeout).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  host-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # The tarball takes its version from apps/desktop/package.json, as the
      # release job's does.
      - name: Sync version from tag
        working-directory: apps/desktop
        run: npm pkg set version="$VERSION"

      - name: Install dependencies
        run: pnpm install

      - name: Build the host tarball
        run: |
          set -euo pipefail
          pnpm run build
          node apps/desktop/scripts/build-host-tarball.mjs
          cp "apps/desktop/dist-electron/manor-host-$VERSION.tgz" apps/desktop/docker/host-image/prebuilt/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/desktop/docker/host-image
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MANOR_HOST_TARBALL=manor-host-${{ env.VERSION }}.tgz
            VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/orrybaram/manor-host:${{ env.VERSION }}
            ghcr.io/orrybaram/manor-host:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Sync version from tag
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: pnpm install

      # electron-builder (<=26.16) passes the .p12 export password to
      # `security set-key-partition-list -k`, which expects the *keychain*
      # password. macOS 26.6 started enforcing that unlock, so its built-in
      # keychain setup fails. We build the keychain ourselves and hand
      # electron-builder CSC_KEYCHAIN, which bypasses that code path.
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/manor-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/certificate.p12"

          echo "$CSC_LINK" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build and publish
        run: pnpm run build && node apps/desktop/scripts/build-host-tarball.mjs && pnpm --filter manor exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Wrangler needs Node >=22; the build above stays on 20. Runs once,
      # on this single macOS job.
      - name: Setup Node.js for wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish web build and deploy relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping relay web build upload and Worker deploy"
            exit 0
          fi
          pnpm run build:web:relay
          node apps/desktop/scripts/upload-web-relay.mjs --remote
          pnpm run relay:deploy

  # Un-drafts the release only once the app (release) and the host image
  # (host-image) are both published, so a release never names a missing image.
  publish:
    needs: [release, host-image]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/{/^## \[$VERSION\]/p; /^## \[/!p}" CHANGELOG.md 2>/dev/null || echo "")
          if [ -n "$NOTES" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --notes "$NOTES"
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
