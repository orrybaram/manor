[package]
name = "manor-pty"
version = "0.1.0"
edition = "2024"
publish = false
description = "Per-pane PTY helper for Manor's terminal host: speaks the pty-subprocess frame protocol."

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
libc = "0.2"
serde_json = "1"
