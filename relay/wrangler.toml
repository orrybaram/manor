# The Manor relay (ADR-206 D1): a blind pipe between one desktop (host) and
# a few browsers (viewers) per room. `pnpm relay:dev` / `relay:deploy`.
name = "manor-relay"
main = "src/index.ts"
compatibility_date = "2026-08-15"

# The relay's one origin: sockets and the web app share it, so the page's
# `connect-src 'self'` covers /join. A custom domain makes Cloudflare create
# the DNS record and certificate on deploy; the manor.sh zone must be in the
# same account. Keep in step with DEFAULT_RELAY_URL in
# electron/remote-control/relay/connector.ts.
routes = [
  { pattern = "relay.manor.sh", custom_domain = true }
]

[vars]
# Per-room byte budget per UTC day, both directions (2 GiB).
RELAY_DAILY_BYTES = "2147483648"
# Hosted Jev calls per UTC day, all users together (ADR-211 D3).
JEV_DAILY_CALLS = "5000"

# Manor's TypeSafe key is a secret, set once with
# `wrangler secret put TYPESAFE_API_KEY`. It never goes in this file.

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# The global daily Jev budget (ADR-211 D3), a singleton.
[[durable_objects.bindings]]
name = "JEV_BUDGET"
class_name = "JevBudget"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JevBudget"]

# Socket dials per client IP, counted separately for /join and /host (keys
# `join:<ip>`, `host:<ip>`). Not a security boundary; it bounds abuse of an
# anonymous relay. namespace_id is an account-unique integer.
[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "2061"
simple = { limit = 30, period = 60 }

# /jev/folder per client IP (key `jevip:<ip>`) and per relay identity (key
# `jevid:<roomId>`). One limit per binding, hence two (ADR-211 D3).
[[ratelimits]]
name = "JEV_LIMITER"
namespace_id = "2062"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "JEV_ID_LIMITER"
namespace_id = "2063"
simple = { limit = 20, period = 60 }

# Workers Logs: persists console output for the whole Worker. The Jev route
# logs only content-free lines (outcome, status, timings; never bodies).
[observability]
enabled = true
head_sampling_rate = 1

# One content-free data point per /jev/folder request (ADR-211). Columns:
# blob1=outcome, blob2=band, double1=status, double2=ms, double3=options,
# double4=confidence, double5=upstream_ms. See relay/README.md.
[[analytics_engine_datasets]]
binding = "JEV_EVENTS"
dataset = "manor_jev"

# Per-version web app builds (ADR-206 D4), uploaded by the release workflow.
[[r2_buckets]]
binding = "WEB"
bucket_name = "manor-relay-web"
preview_bucket_name = "manor-relay-web-dev"
