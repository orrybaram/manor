<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!--
      `interactive-widget=resizes-visual` (ADR-181 D6): the soft keyboard
      shrinks only the visual viewport, never the layout one. It is Chrome
      for Android's default, but a browser that defaults to
      `resizes-content` shrinks the initial containing block — and `100lvh`
      with it — so opening the keyboard would resize every terminal and
      SIGWINCH the panes this renderer owns the winsize of. Saying it
      outright makes the phone shell's `100lvh` hold everywhere that honours
      the key; iOS Safari ignores it and already behaves this way.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual"
    />
    <!--
      Injected by `vite.web.config.ts` from `WEB_CSP` in
      `electron/remote-control/static.ts` — the one source, so this tag
      cannot drift from the header that route sends for `/app`. Redundant
      with that header; a second line of defence for a browser that, for
      whatever reason, does not see it.
    -->
    <!--csp-->
    <!--
      The web app manifest, `theme-color`, `apple-mobile-web-app-capable` and
      the touch icon are injected by `vite.web.config.ts` (`webAppManifest`)
      with this build's base: installable so that iOS Home Screen opens it as
      a web app, the only place iOS offers Web Push (ADR-206 D7).
    -->
    <title>Manor</title>
    <!--
      Painted before a byte of script has run. Over the relay the app's first
      frame waits on its bundle, a handshake and the host's layout — seconds
      on a phone — and until then this is what is on screen instead of a
      white page. React replaces it on its first render.
    -->
    <style>
      html, body { margin: 0; background: #1e1e2e; color: #a6adc8; }
      .boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font: 14px system-ui, -apple-system, sans-serif;
      }
      .boot-mark {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid #45475a; border-top-color: #b4befe;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
    </style>
  </head>

  <body>
    <div id="root"><div class="boot" role="status"><div class="boot-mark"></div>Connecting to Manor…</div></div>
    <script type="module" src="./web-main.tsx"></script>
  </body>
</html>
